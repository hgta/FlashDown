name: release

# Pushing a v* tag builds the Windows binary and publishes it, so a release
# never depends on whoever happens to have the toolchain installed locally.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Same version as go.mod, so the bindings generator and the runtime agree.
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.30

      # The generated bindings are committed, so no code generation is needed
      # here; only the production bundle the Go binary embeds.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Generate Windows resources
        working-directory: build
        run: wails3 generate syso -arch amd64 -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_amd64.syso

      - name: Build executable
        run: go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o bin/flashdown.exe

      - name: Package
        run: Compress-Archive -Path @('bin/flashdown.exe', 'SYSTEM-REQUIREMENTS.txt') -DestinationPath "flashdown-${{ github.ref_name }}-win64.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          "flashdown-${{ github.ref_name }}-win64.zip"
          --title "FlashDown ${{ github.ref_name }}"
          --notes-file RELEASE_NOTES.md
